version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: examenpc1
    restart: always
    environment:
      POSTGRES_DB: utecexamen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - utec_examen:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d utecexamen"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  utec_examen:
